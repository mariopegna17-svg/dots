# Free private workspace. Free instances have ephemeral storage and can sleep.
services:
  - type: web
    name: dots-public
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: APP_AUTH_TOKEN
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "1"
      - key: PUBLIC_DEMO_ENABLED
        value: "0"
      - key: PUBLIC_DEMO_DAILY_LIMIT
        value: "20"
      - key: COMPUTER_PROVIDER
        value: remote
